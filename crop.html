<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="450" height="490"></canvas>
<script>
const img = new Image();
img.src = '/public/FullLogo.jpg';
img.onload = () => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // Crop only the visual circle with the cat and paws (no surrounding text)
  ctx.drawImage(img, 415, 280, 450, 490, 0, 0, 450, 490);
  const dataUrl = canvas.toDataURL('image/png');
  fetch('/api/save-cropped-logo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataUrl })
  }).then(r => r.json()).then(res => {
    document.body.innerHTML = '<h1>CROPPED SUCCESSFULLY</h1>';
  });
};
</script>
</body>
</html>
